[project]
name = "minillm-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.15.0",
    "torchvision",
    "torchaudio",
    "accelerate>=1.15.0",
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
    "transformers>=5.24.1",
]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.uv.sources]
torch       = { index = "pytorch-cu134" }
torchvision = { index = "pytorch-cu134" }
torchaudio  = { index = "pytorch-cu134" }
